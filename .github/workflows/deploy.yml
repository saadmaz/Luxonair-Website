name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build-time env vars (no secrets needed for the build step)
          NODE_ENV: production

      - name: Deploy to Hostinger via SSH
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: ADMIN_USERNAME,ADMIN_PASSWORD_HASH
          script: |
            set -eo pipefail
            cd ${{ secrets.APP_PATH }}

            # ── Pre-deploy backup ─────────────────────────────────────────────────
            # Always dump the database before touching schema/code, so a bad deploy
            # (migration or otherwise) is recoverable. Fails the deploy (via set -e)
            # if the dump itself fails, rather than risking an unrecoverable change.
            BACKUP_DIR="$HOME/db-backups"
            mkdir -p "$BACKUP_DIR"
            DB_URL=$(grep -m1 '^DATABASE_URL=' .env | cut -d '=' -f2-)
            DB_USER=$(echo "$DB_URL" | sed -E 's#mysql2?://([^:]+):.*#\1#')
            DB_PASS=$(echo "$DB_URL" | sed -E 's#mysql2?://[^:]+:([^@]+)@.*#\1#')
            DB_HOST=$(echo "$DB_URL" | sed -E 's#.*@([^:/]+).*#\1#')
            DB_NAME=$(echo "$DB_URL" | sed -E 's#.*/([^/?]+).*#\1#')
            mysqldump -h"$DB_HOST" -u"$DB_USER" -p"$DB_PASS" "$DB_NAME" | gzip > "$BACKUP_DIR/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            # keep the last 14 backups only
            ls -1t "$BACKUP_DIR"/*.sql.gz | tail -n +15 | xargs -r rm --

            git pull origin main
            npm ci --omit=dev
            npm run build
            # TODO(db-migrations-cutover): still using `drizzle-kit push` here rather than
            # `npm run db:migrate` — see db/migrate.ts. Cutover is pending a one-time
            # `npm run db:migrate -- --baseline` run against this database (this database's
            # tables were created via `push`, not tracked migrations, so the normal migrate
            # path would try to re-run CREATE TABLE for tables that already exist). Once
            # baselined, replace the line below with `npm run db:migrate`.
            npm run db:push
            # Update admin credentials in .env from GitHub Secrets
            if [ -n "$ADMIN_USERNAME" ]; then
              sed -i "s|^ADMIN_USERNAME=.*|ADMIN_USERNAME=${ADMIN_USERNAME}|" .env || echo "ADMIN_USERNAME=${ADMIN_USERNAME}" >> .env
            fi
            if [ -n "$ADMIN_PASSWORD_HASH" ]; then
              sed -i "s|^ADMIN_PASSWORD_HASH=.*|ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}|" .env || echo "ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}" >> .env
            fi
            pm2 reload ecosystem.config.cjs --update-env
